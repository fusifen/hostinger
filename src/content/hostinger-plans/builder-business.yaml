verdict: 加 15 元/月解锁电商能力，可以直接在 Builder 里上架商品、管理库存、收单。适合产品线简单（10 到 50 个 SKU）、不想折腾 WooCommerce 的小型卖家。
bestFor: 小型电商卖家、想快速开一个卖货页面的个体商户
caveat: 商品超过百件或需要复杂的变体、优惠券规则时，Builder 的电商模块会明显不够用 —— 那时请转向 WordPress + WooCommerce，而不是硬撑。
