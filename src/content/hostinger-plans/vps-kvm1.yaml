verdict: 4GB 内存 + 1 核 vCPU 的入门配置，跑 3 到 5 个 WordPress 站或者一台自建服务绰绰有余。真正的价值不在价格，而在于你拿到了完整的 root 和一个独立 IP —— 这是共享主机永远给不了的东西。
bestFor: 想摆脱共享主机限制的进阶站长、自建服务的开发者
caveat: 只有 1 核 vCPU，单进程密集任务（如大图压缩、批量爬取）会明显吃力；1 核也意味着没有冗余，某项服务跑满会拖慢整机。
